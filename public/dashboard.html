<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Medicare Hospital</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Unicons for icons -->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                        <path
                            d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08v0c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.15-.49v0c1.31.55 2.08 1.98 1.94 3.38" />
                    </svg>
                    <span>MediCare</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-tab="dashboard">
                    <i class="uil uil-apps"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-tab="appointments">
                    <i class="uil uil-calendar-alt"></i>
                    <span>Appointments</span>
                </a>
                <a href="#" class="nav-item" data-tab="patients">
                    <i class="uil uil-users-alt"></i>
                    <span>Patients</span>
                </a>
                <a href="#" class="nav-item" data-tab="meals">
                    <i class="uil uil-utensils"></i>
                    <span>Meals</span>
                </a>
                <a href="#" class="nav-item" data-tab="doctors">
                    <i class="uil uil-stethoscope"></i>
                    <span>Doctors</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="search-bar">
                    <i class="uil uil-search"></i>
                    <input type="text" placeholder="Search patients, doctors, appointments...">
                </div>
                <div class="user-profile">
                    <div class="notifications">
                        <i class="uil uil-bell"></i>
                        <span class="badge"></span>
                    </div>
                    <div class="profile-info">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=random" alt="Admin">
                        <div>
                            <h4>Admin User</h4>
                            <small>Administrator</small>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div id="content-area" class="content-area">
                <!-- Content injected via JS -->
            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>

</html>
