<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link rel="stylesheet" href="patient.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="dashboard-header">
        <h1>Patient Dashboard</h1>
        <p>Search and view patient information</p>
    </div>

    <div class="container">

        <!-- LEFT PATIENT LIST -->
        <div class="patient-list">

            <div class="patient-card active" onclick="showPatient('john', this)">
                <span><i class="fa-solid fa-address-book"></i></span>
                <div class="patient-info">
                    <div class="patient-name">John Smith</div>
                    <small class="bed">Bed A-101</small>
                </div>
            </div>

            <div class="patient-card" onclick="showPatient('mary', this)">
                <span><i class="fa-solid fa-address-book"></i></span>
                <div class="patient-info">
                    <div class="patient-name">Mary Johnson</div>
                    <small class="bed">Bed B-205</small>
                </div>
            </div>

            <div class="patient-card" onclick="showPatient('robert', this)">
                <span><i class="fa-solid fa-address-book"></i></span>
                <div class="patient-info">
                    <div class="patient-name">Robert Williams</div>
                    <small class="bed">Bed C-312</small>
                </div>
            </div>

            <div class="patient-card" data-name="lisa brown" onclick="showPatient('lisa', this)">
                <span><i class="fa-solid fa-address-book"></i></span>
                <div class="patient-info">
                    <div class="patient-name">Lisa Brown</div>
                    <small class="bed">Bed A-105</small>
                </div>
            </div>


        </div>

        <!-- RIGHT SECTION -->
        <div class="right-section">

            <!-- PROFILE CARD -->
            <div class="profile-card">
                <h3>Patient Profile</h3>
                <p><b>Name:</b> <span id="pName"></span></p>
                <p><b>Age & Gender:</b> <span id="pAgeGender"></span></p>
                <p><b>Bed:</b> <span id="pBed"></span></p>
                <p><b>Diagnosis:</b> <span id="pDiagnosis"></span></p>
                <p><b>Doctor:</b> <span id="pDoctor"></span></p>
            </div>

            <!-- MEDICINE CARD -->
            <div class="medicine-card">
                <h3>Prescribed Medicines</h3>
                <div id="medicines"></div>
            </div>

        </div>

    </div>


    <script src="patient.js"></script>
</body>

</html>
